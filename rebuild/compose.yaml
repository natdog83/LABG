name: labg-local
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 20
  wordpress:
    build: ./wordpress
    image: labg-wordpress-dev:local
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      db:
        condition: service_healthy
    environment: &wp_env
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes: &wp_volumes
      - wp:/var/www/html
      - ./wordpress/theme:/var/www/html/wp-content/themes/labg-recovery:ro
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./generated/assets:/var/www/html/recovered-assets:ro
      - ./:/rebuild:ro
  cli:
    image: labg-wordpress-dev:local
    entrypoint: [wp]
    user: "33:33"
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment: *wp_env
    volumes: *wp_volumes
volumes:
  db:
  wp:
